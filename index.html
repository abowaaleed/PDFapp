<!DOCTYPE html>
<html>
<head>
  <base href="/PDFapp/">
  <meta charset="UTF-8">
  <title>PDF-sw411</title>
  <style>
    body {
      background-color: #f3f3f3;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .loading {
      color: #1A3A5F;
    }
  </style>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="status">
    <h2 class="loading">Loading PDF-sw411 v1.0.6...</h2>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script>
    window.addEventListener('load', function() {
      if (window['pdfjs-dist/build/pdf']) {
        window.pdfjsLib = window['pdfjs-dist/build/pdf'];
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    window.PDFUtils = {
      extractText: async function(data) {
        var pdf, page, tc, text, texts, i;
        try {
          pdf = await pdfjsLib.getDocument({data: data}).promise;
        } catch (e) {
          return JSON.stringify({error: e.message || 'Failed to load PDF'});
        }
        texts = [];
        for (i = 1; i <= pdf.numPages; i++) {
          try {
            page = await pdf.getPage(i);
            tc = await page.getTextContent();
            text = tc.items.map(function(item) { return item.str; }).join(' ');
            texts.push(text);
          } catch (e) {
            texts.push('');
          }
        }
        return JSON.stringify({pages: texts});
      },

      ocrImage: async function(blobUrl, lang) {
        try {
          var result = await Tesseract.recognize(blobUrl, lang || 'ara+eng');
          return JSON.stringify({
            text: result.data.text,
            confidence: result.data.confidence || 0
          });
        } catch (e) {
          return JSON.stringify({error: e.message || 'OCR failed'});
        }
      }
    };
  </script>
</body>
</html>
