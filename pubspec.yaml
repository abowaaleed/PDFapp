name: pdf_app
description: A new Flutter project for merging images to PDF and compressing PDFs.
version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  pdf: ^3.10.8
  image: ^4.1.3
  file_picker: ^6.1.1
  printing: ^5.11.1
  flutter_reorderable_grid_view: ^5.1.0
  google_fonts: ^6.1.0
  provider: ^6.1.1
  intl: ^0.20.2
  path: ^1.8.3
  pdfx: ^2.4.0
  file_saver: ^0.2.1
  web: ^1.1.1
  docx_dart: ^1.2.0
  js: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
